ekf_filter_node:              # must match the node name in the launch file
  ros__parameters:
    use_sim_time: true
    frequency: 30.0           # Hz, how often the filter outputs
    two_d_mode: true          # ignore z, roll, pitch (flat-ish ground for now)
    publish_tf: true          # publish odom -> base_footprint

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom         # local EKF: world = odom (no map yet)

    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]

    imu0: /imu/data
    imu0_config: [false, false, false,    # x y z
                  false, false, true,    # yaw from Madgwick
                  false, false, false,    # vx vy vz
                  false, false, true,     # vroll vpitch vyaw  <- gyro turn rate
                  false, false, false]    # ax ay az (skip for now, try in Chunk C)

